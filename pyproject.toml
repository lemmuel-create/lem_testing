[project]
name = "rfcomp"
version = "0.2.0"
description = "FCC pre-compliance RF analysis toolkit"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy",
    "pydantic>=2",
    "pyyaml",
    "typer",
]

[project.scripts]
rfcomp = "rfcomp.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfcomp"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
